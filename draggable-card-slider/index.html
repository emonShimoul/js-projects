<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Card Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <i class="fa-solid fa-angle-left"></i>
      <ul class="carousel">
        <li class="card">
          <div class="img">
            <img src="images/img1.jpg" alt="Image" />
          </div>
          <h2>Emon Shimoul</h2>
          <span>Web Developer</span>
        </li>

        <li class="card">
          <div class="img">
            <img src="images/img2.jpg" alt="Image" />
          </div>
          <h2>Shimoul Uddin</h2>
          <span>Digital Advertiser</span>
        </li>

        <li class="card">
          <div class="img">
            <img src="images/img3.jpg" alt="Image" />
          </div>
          <h2>Mr. Professor</h2>
          <span>Professor</span>
        </li>

        <li class="card">
          <div class="img">
            <img src="images/img4.jpg" alt="Image" />
          </div>
          <h2>Shimoul Emon</h2>
          <span>Content Creator</span>
        </li>

        <li class="card">
          <div class="img">
            <img src="images/img5.jpg" alt="Image" />
          </div>
          <h2>Emon Shimoul</h2>
          <span>Software Developer</span>
        </li>
      </ul>
      <i class="fa-solid fa-angle-right"></i>
    </div>
    <script
      src="https://kit.fontawesome.com/5daa505ed9.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
